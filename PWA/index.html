<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kazam ROI Quality Check</title>
  <meta name="description" content="Browser PWA for Kazam charger, multimeter, and LCD ROI detection using ONNX Runtime Web." />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00e68a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header class="header">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch to light theme">
        <span class="theme-toggle-icon">Sun</span>
        <span class="theme-toggle-text">Light</span>
      </button>
      <div class="header-badge">PWA</div>
      <h1>Kazam ROI Quality Check</h1>
      <p class="subtitle">YOLO ONNX detection for Kazam box, multimeter, and LCD screen</p>
    </header>

    <main class="main">
      <section class="upload-section" id="uploadSection">
        <div id="dropzone" class="dropzone">
          <div class="dropzone-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <p class="dropzone-text">Drop an image here or <span class="dropzone-link">browse</span></p>
          <p class="dropzone-hint">Supports JPG, PNG, WebP</p>
          <input type="file" id="fileInput" accept="image/*" hidden />
        </div>
        <button id="testBtn" class="btn btn-ghost test-button">
          Load Test Image
        </button>
        <button id="clearCacheBtn" class="btn btn-ghost test-button">
          Refresh Installed App
        </button>
      </section>

      <section class="canvas-section" id="canvasSection">
        <div class="canvas-wrapper">
          <canvas id="canvas"></canvas>
        </div>
        <div class="controls">
          <button id="detectBtn" class="btn btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="btn-label">Run ROI Check</span>
          </button>
          <button id="resetBtn" class="btn btn-ghost">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 5.64-11.36L1 10"/>
            </svg>
            New Image
          </button>
        </div>
      </section>

      <section class="results-section" id="resultsSection">
        <h2 class="results-title">Quality Result</h2>
        <div id="resultsList" class="results-list"></div>
      </section>
    </main>

    <footer class="footer">
      <div id="status" class="status-bar">
        <span class="status-dot"></span>
        <span id="statusText">Initializing...</span>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
