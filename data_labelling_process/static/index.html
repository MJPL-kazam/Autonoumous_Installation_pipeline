<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DINO ROI Review — Kazam Installation Labels</title>
  <style>
    :root{--bg:#0c0e13;--panel:#14171e;--line:#282e3a;--text:#eef1f7;--muted:#8a93a5;--accent:#36c5f0;--green:#28d250;--red:#ff4040;--orange:#ff9020}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px}
    .app{display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:100vh}
    .stage{display:flex;align-items:center;justify-content:center;padding:12px;overflow:auto}
    canvas{display:block;max-width:100%;max-height:calc(100vh - 24px);border:1px solid var(--line);background:#07080b;cursor:crosshair}
    aside{background:var(--panel);border-left:1px solid var(--line);padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
    h1{font-size:18px;font-weight:700}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .stat{padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600}
    .stat.approved{background:#1a3a22;color:var(--green)}
    .stat.rejected{background:#3a1a1a;color:var(--red)}
    .stat.pending{background:#2a2a1a;color:var(--orange)}
    .stat.total{background:#1a2a3a;color:var(--accent)}
    .meta{color:var(--muted);font-size:12px;line-height:1.4;overflow-wrap:anywhere}
    .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;background:#1e2838;color:var(--accent);margin-left:6px}
    .region-list{display:grid;gap:8px}
    .region{display:grid;grid-template-columns:16px 1fr;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 10px;cursor:pointer;border-radius:4px;transition:border-color .15s}
    .region:hover{border-color:#556}
    .region.active{border-color:var(--accent);background:#1a2030}
    .swatch{width:14px;height:14px;border-radius:3px}
    label.field{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
    input,select{width:100%;border:1px solid var(--line);background:#0a0d12;color:var(--text);padding:8px 10px;font-size:13px;border-radius:4px}
    input:focus,select:focus{outline:none;border-color:var(--accent)}
    .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    button{border:1px solid var(--line);background:#1c2030;color:var(--text);padding:8px 10px;cursor:pointer;font-weight:600;font-size:13px;border-radius:4px;transition:background .15s}
    button:hover{background:#28304a}
    button.primary{background:#145d7a;border-color:#237fa3}
    button.primary:hover{background:#1a7a9a}
    .hint{font-size:11px;color:var(--muted);line-height:1.4}
    pre.status{font-size:12px;color:var(--muted);white-space:pre-wrap;min-height:2em}
  </style>
</head>
<body>
  <div class="app">
    <main class="stage"><canvas id="canvas"></canvas></main>
    <aside>
      <h1>DINO ROI Review</h1>
      <div class="stats" id="statsBar"></div>
      <div id="counter" class="meta"></div>
      <div id="imageMeta" class="meta"></div>

      <div>
        <label class="field">LCD screen value (7-segment reading)</label>
        <input id="lcdValue" type="text" placeholder="e.g. 00.2, 217, 0.01" />
      </div>

      <div id="regions" class="region-list"></div>

      <div class="btn-grid">
        <button id="prevBtn">← Prev</button>
        <button id="nextBtn">Next →</button>
        <button id="clearActiveBtn">Clear ROI</button>
        <button id="clearAllBtn">Clear All</button>
        <button id="rawBtn">Raw Image</button>
        <button id="previewBtn">DINO Preview</button>
      </div>
      <div class="btn-grid">
        <button id="saveBtn" class="primary">Save</button>
        <button id="saveNextBtn" class="primary">Save + Next</button>
        <button id="rejectBtn" style="background:#5a1010;border-color:#7a1515;grid-column: span 2">Reject</button>
      </div>
      <div class="hint">
        Keys: <b>1</b> Kazam, <b>2</b> Meter, <b>3</b> LCD, <b>4</b> Cover, <b>5</b> QR, <b>←→</b> navigate.<br/>
        Draw on image to replace selected ROI box.
      </div>
      <pre id="status" class="status"></pre>
    </aside>
  </div>

  <script>
    const REGIONS = __REGIONS__;
    let manifest = [];
    let globalStats = {};
    let index = 0;
    let item = null;
    let boxes = {};
    let activeRegion = "kazam_box";
    let img = new Image();
    let showPreview = false;
    let drawing = false;
    let start = null;
    let current = null;

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const counterEl = document.getElementById("counter");
    const metaEl = document.getElementById("imageMeta");
    const statusEl = document.getElementById("status");
    const lcdValueEl = document.getElementById("lcdValue");
    const statsBar = document.getElementById("statsBar");

    function status(t) { statusEl.textContent = t; }

    function renderStats() {
      statsBar.innerHTML = [
        `<span class="stat total">${globalStats.total || 0} total</span>`,
        `<span class="stat approved">${globalStats.approved || 0} approved</span>`,
        `<span class="stat rejected">${globalStats.rejected || 0} rejected</span>`,
        `<span class="stat pending">${globalStats.pending || 0} pending</span>`,
      ].join("");
    }

    function normBox(b) {
      const x1=Math.round(Math.min(b.x1,b.x2)),y1=Math.round(Math.min(b.y1,b.y2));
      const x2=Math.round(Math.max(b.x1,b.x2)),y2=Math.round(Math.max(b.y1,b.y2));
      return (x2>x1&&y2>y1)?{x1,y1,x2,y2}:null;
    }

    function imagePoint(evt) {
      const r=canvas.getBoundingClientRect();
      return {
        x:Math.max(0,Math.min(canvas.width,(evt.clientX-r.left)*canvas.width/r.width)),
        y:Math.max(0,Math.min(canvas.height,(evt.clientY-r.top)*canvas.height/r.height)),
      };
    }

    function buildRegions() {
      const root=document.getElementById("regions");
      root.innerHTML="";
      Object.entries(REGIONS).forEach(([key,cfg])=>{
        const el=document.createElement("div");
        el.className="region";
        el.dataset.region=key;
        el.innerHTML=`<span class="swatch" style="background:${cfg.color}"></span><span>${cfg.label}</span>`;
        el.onclick=()=>{activeRegion=key;updateRegions();};
        root.appendChild(el);
      });
      updateRegions();
    }

    function updateRegions() {
      document.querySelectorAll(".region").forEach(el=>{
        const key = el.dataset.region;
        const isActive = key === activeRegion;
        const hasBox = !!boxes[key];
        el.classList.toggle("active", isActive);
        el.style.opacity = hasBox ? "1.0" : "0.4";
      });
      redraw();
    }

    function drawOne(key,b,transient=false) {
      if(!b)return;
      const cfg=REGIONS[key];
      const isActive = (key === activeRegion);
      ctx.strokeStyle=cfg.color;
      ctx.lineWidth = transient ? 2 : (isActive ? 6 : 3);
      if (isActive && !transient) {
        ctx.shadowBlur = 10;
        ctx.shadowColor = cfg.color;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.strokeRect(b.x1,b.y1,b.x2-b.x1,b.y2-b.y1);
      ctx.shadowBlur = 0;
      ctx.font="22px Segoe UI";
      ctx.fillStyle=cfg.color;
      ctx.fillText(cfg.label,b.x1+4,Math.max(24,b.y1-8));
    }

    function redraw() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      if(img.complete)ctx.drawImage(img,0,0);
      Object.entries(boxes).forEach(([k,b])=>drawOne(k,b));
      if(current)drawOne(activeRegion,normBox(current),true);
    }

    async function loadManifest() {
      const res=await fetch("/api/manifest");
      const data=await res.json();
      manifest=data.queue;
      globalStats=data.stats;
      renderStats();
      buildRegions();
      if(!manifest.length)return status("No records need review. Use --show-all to inspect all.");
      await loadImage(0);
    }

    async function loadImage(next) {
      index=Math.max(0,Math.min(manifest.length-1,next));
      item=await(await fetch(`/api/item?index=${index}`)).json();
      boxes=item.boxes||{};
      updateRegions();
      lcdValueEl.value=item.lcd_screen_value||"";
      counterEl.textContent=`Image ${index+1} / ${manifest.length}`;
      let meta = item.relative_image_path||item.image_id;
      if(item.installation_id) meta+=`\nInstallation: ${item.installation_id}`;
      if(item.measurement_type) meta+=`  |  Measurement: ${item.measurement_type}`;
      metaEl.textContent=meta;
      const mode=showPreview?"preview":"raw";
      img=new Image();
      img.onload=()=>{canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;redraw();};
      img.onerror=()=>{
        if(showPreview){showPreview=false;status("DINO preview missing, showing raw.");loadImage(index);}
        else status("Image file could not be loaded.");
      };
      img.src=`/file?index=${index}&mode=${mode}&t=${Date.now()}`;
      status(`Loaded ${mode}.`);
    }

    // ── Drawing ──
    canvas.addEventListener("mousedown",evt=>{drawing=true;start=imagePoint(evt);current={x1:start.x,y1:start.y,x2:start.x,y2:start.y};redraw();});
    canvas.addEventListener("mousemove",evt=>{if(!drawing)return;const p=imagePoint(evt);current={x1:start.x,y1:start.y,x2:p.x,y2:p.y};redraw();});
    window.addEventListener("mouseup",()=>{if(!drawing)return;drawing=false;const b=normBox(current);if(b){boxes[activeRegion]=b;}current=null;updateRegions();});

    async function save(goNext=false) {
      const payload={row_index:item.row_index,review_status:"approved",lcd_screen_value:lcdValueEl.value.trim(),boxes};
      const res=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const result=await res.json();
      if(!result.ok)return status(`Save failed: ${result.error}`);
      status(`Saved ${item.image_id}`);
      const next=goNext?index+1:index;
      const data=await(await fetch("/api/manifest")).json();
      manifest=data.queue;globalStats=data.stats;renderStats();
      if(!manifest.length){ctx.clearRect(0,0,canvas.width,canvas.height);counterEl.textContent="";metaEl.textContent="";return status("All records reviewed!");}
      await loadImage(Math.min(next,manifest.length-1));
    }

    async function reject(goNext=true) {
      const payload={row_index:item.row_index,review_status:"rejected",lcd_screen_value:"",boxes:{}};
      const res=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      const result=await res.json();
      if(!result.ok)return status(`Reject failed: ${result.error}`);
      status(`Rejected ${item.image_id}`);
      const next=goNext?index+1:index;
      const data=await(await fetch("/api/manifest")).json();
      manifest=data.queue;globalStats=data.stats;renderStats();
      if(!manifest.length){ctx.clearRect(0,0,canvas.width,canvas.height);counterEl.textContent="";metaEl.textContent="";return status("All records reviewed!");}
      await loadImage(Math.min(next,manifest.length-1));
    }

    // ── Buttons ──
    document.getElementById("prevBtn").onclick=()=>loadImage(index-1);
    document.getElementById("nextBtn").onclick=()=>loadImage(index+1);
    document.getElementById("clearActiveBtn").onclick=()=>{delete boxes[activeRegion];updateRegions();};
    document.getElementById("clearAllBtn").onclick=()=>{boxes={};updateRegions();};
    document.getElementById("rawBtn").onclick=()=>{showPreview=false;loadImage(index);};
    document.getElementById("previewBtn").onclick=()=>{showPreview=true;loadImage(index);};
    document.getElementById("saveBtn").onclick=()=>save(false);
    document.getElementById("saveNextBtn").onclick=()=>save(true);
    document.getElementById("rejectBtn").onclick=()=>reject(true);

    // ── Keyboard ──
    document.addEventListener("keydown",evt=>{
      if(["INPUT","SELECT"].includes(evt.target.tagName))return;
      if(evt.key==="1")activeRegion="kazam_box";
      if(evt.key==="2")activeRegion="multimeter";
      if(evt.key==="3")activeRegion="lcd_screen";
      if(evt.key==="4")activeRegion="kazam_box_black_cover";
      if(evt.key==="5")activeRegion="qr_code";
      if(evt.key==="ArrowLeft")loadImage(index-1);
      if(evt.key==="ArrowRight")loadImage(index+1);
      updateRegions();
    });

    loadManifest();
  </script>
</body>
</html>
